# Plume generator parameters — exact copy of spray.plume.PlumeConfig defaults.
# Every key here is a real dataclass field, so PlumeConfig(**yaml.safe_load(...))
# reconstructs the current generator unchanged. Sources per field are documented
# in spray/plume.py and docs/history/plume-model-provenance.md; do not invent values.
point_cloud_range: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0]
min_speed_kmh: 40.0
water_film_height_m: 0.001
sample_water_film: true
water_film_mm: null
cluster_count_velocity_offset_kmh: 50.0
lifetime_water_film_coeff: 0.02
lifetime_base_s: 0.2
lifetime_max_age_factor: 12.0
